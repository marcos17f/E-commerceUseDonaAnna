<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Use Dona Anna</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .error-page{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;
  }
  .error-page .brand-mark{width:64px;height:64px;margin-bottom:24px;}
  .error-page h1{font-family:var(--font-display);font-style:italic;font-size:clamp(60px,12vw,120px);color:var(--pink-deep);margin:0;line-height:1;}
  .error-page p{color:var(--text-muted);max-width:420px;margin:14px 0 30px;}
</style>
</head>
<body>
  <div class="error-page">
    <img class="brand-mark" src="assets/logo-mark.png" alt="Use Dona Anna">
    <h1>404</h1>
    <p>Ops, essa página saiu de moda... ou nunca existiu! Volte pra vitrine e continue seu passeio pelas nossas peças.</p>
    <a href="/" class="btn btn-solid">Voltar para a loja</a>
  </div>
</body>
</html>
